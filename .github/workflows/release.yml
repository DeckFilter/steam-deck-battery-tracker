name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Run Release from the default branch."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Bump version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.release_type }}
        run: |
          tag=$(npm version "$VERSION_BUMP" --no-git-tag-version --ignore-scripts --package-lock=false)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check plugin
        run: pnpm run typecheck

      - name: Build plugin
        run: pnpm run build

      - name: Create archives
        run: |
          temp_dir=$(mktemp -d)
          temp_dir_zip=$(mktemp -d)

          mkdir -p "$temp_dir/steam-deck-battery-tracker"
          mkdir -p "$temp_dir_zip/steam-deck-battery-tracker"

          cp -r dist py_modules "$temp_dir/steam-deck-battery-tracker"
          cp main.py plugin.json package.json README.md LICENSE "$temp_dir/steam-deck-battery-tracker"

          cp -rL dist py_modules "$temp_dir_zip/steam-deck-battery-tracker"
          cp main.py plugin.json package.json README.md LICENSE "$temp_dir_zip/steam-deck-battery-tracker"

          tar -czvf steam-deck-battery-tracker.tar.gz -C "$temp_dir" steam-deck-battery-tracker
          (
            cd "$temp_dir_zip"
            zip -r "$OLDPWD/steam-deck-battery-tracker.zip" steam-deck-battery-tracker
          )

      - name: Show files
        run: |
          echo "=== tar.gz contents ==="
          tar -tzvf steam-deck-battery-tracker.tar.gz | head -20
          echo ""
          echo "=== zip contents ==="
          unzip -l steam-deck-battery-tracker.zip | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-deck-battery-tracker
          path: |
            steam-deck-battery-tracker.tar.gz
            steam-deck-battery-tracker.zip

      - name: Commit and tag the release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG"

  publish:
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/steam-deck-battery-tracker/steam-deck-battery-tracker.tar.gz
            /tmp/artifacts/steam-deck-battery-tracker/steam-deck-battery-tracker.zip
          tag_name: ${{ needs.build_plugin.outputs.tag }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
